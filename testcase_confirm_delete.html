{% extends 'base.html' %}
{% block title %}Delete Test Case — API Sentinel{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto;">
  <div class="card" style="border-color: var(--danger-border);">
    <div class="card-header" style="background-color: var(--danger-bg);">
      <h2 class="card-title" style="color: var(--danger);">Confirm Test Case Removal</h2>
    </div>
    <div class="card-body">
      <p style="margin-bottom: 14px;">
        Are you sure you want to delete test case <b>{{ case.name }}</b> from suite <b>{{ case.suite.name }}</b>?
      </p>
      <form method="POST">
        {% csrf_token %}
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-danger">Yes, Delete</button>
          <a href="{% url 'suite_detail' case.suite.id %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
